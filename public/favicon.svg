<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Watch case / bezel -->
  <circle cx="16" cy="13" r="8" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Watch crown, protruding cleanly from the side -->
  <rect x="24" y="11.5" width="3.5" height="3" rx="0.8" fill="#1a1a1a"/>

  <!-- Watch hands -->
  <line x1="16" y1="13" x2="16" y2="8.5" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="16" y1="13" x2="19" y2="14.5" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Venus symbol tail, integrated as the watch's "stand" -->
  <line x1="16" y1="21" x2="16" y2="27.5" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="12.5" y1="25" x2="19.5" y2="25" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
</svg>
